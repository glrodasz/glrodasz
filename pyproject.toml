[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "profilecard"
version = "1.0.0"
description = "Generates the glrodasz GitHub profile card SVGs from live GitHub stats"
readme = "README.md"
requires-python = ">=3.11"  # tomllib
dependencies = []           # runtime is stdlib-only, by design

[project.optional-dependencies]
art = ["pillow", "numpy"]   # tools/make_art.py only, never the daily Action
dev = ["pytest"]

[project.scripts]
profilecard = "profilecard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/profilecard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]  # short lambdas are idiomatic in the layout helpers
